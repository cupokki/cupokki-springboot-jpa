<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupokki JPA Web MVC</title>
    <!-- ✅ Tailwind CDN 추가 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>
<body>
<header class="bg-mint-300 p-2 flex justify-between">
    <a href="/" class="">
        <img th:src="@{/logo12864t.png}" alt="Logo">
    </a>
    <div class="flex">
        <a th:href="@{/members/join}" class="justify-center p-2 inline-block">
            <i class="text-3xl bi bi-person-plus"></i>
            <div class="text-[0.25em] font-100">
                가입
            </div>
        </a>
        <a th:href="@{/members/login}" class="justify-center p-2 inline-block">
            <i class="text-3xl bi bi-box-arrow-in-left"></i>
            <div class="text-[0.25em] font-100">
                로그인
            </div>
        </a>
        <a th:href="@{/members/login}" class="justify-center p-2 inline-block">
            <i class="text-3xl bi bi-box-arrow-right"></i>
            <div class="text-[0.25em] font-100">
                로그아웃
            </div>
        </a>
        <a th:href="@{/members/login}" class="justify-center p-2 inline-block">
            <i class="text-3xl bi bi-person-plus"></i>
            <div class="text-[0.25em] font-100">
                프로필
            </div>
        </a>
    </div>

</header>
<main>
<div class="flex flex-col items-center justify-center max-w-lg min-w-[300px] mx-auto my-[100px] py-[100px] border-2 border-solid rounded-lg">
    <div class="flex flex-wrap gap-2 justify-center items-start">
        <a class="w-1/3 bg-gray-500 text-bold text-white p-6 rounded-lg hover:bg-gray-700 transition duration-300" th:href="@{/posts}">
            <i class="bi bi-list-ul p-2"></i><span>게시판 1</span></a>
        <div class="w-1/3 bg-blue-500 text-bold text-white p-6 rounded-lg hover:bg-blue-700 transition duration-300">
            <a th:href="@{/posts}"><i class="bi bi-list-ul p-2"></i>게시판 2</a></div>
        <div class="w-1/3 bg-blue-500 text-bold text-white p-6 rounded-lg hover:bg-blue-700 transition duration-300">
            <a th:href="@{/posts}"><i class="bi bi-list-ul p-2"></i>게시판 3</a></div>
        <div class="w-1/3 bg-blue-500 text-bold text-white p-6 rounded-lg hover:bg-blue-700 transition duration-300">
            <a th:href="@{/posts}"><i class="bi bi-list-ul p-2"></i>게시판 4</a></div>
    </div>
</div>
</main>
<footer class="flex justify-center p-20">
    <a href="https://github.com/cupokki" class=""> <i class="bi bi-github"> </i>cupokki</a>
    <p class="">(c) 2025, All right reserved by cupokki</p>




</footer>
</body>
</html>
