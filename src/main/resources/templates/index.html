<!DOCTYPE html>
<html lang="ko"

      layout:decorate="~{layouts/layout.html}">

    <title>Cupokki JPA Web MVC</title>

<body>

<main layout:fragment="main-content" class="bg-black">

        <a class="w-1/2 bg-gray-800 text-bold text-white p-6 rounded-lg hover:bg-gray-700 transition duration-300" th:href="@{/posts}">
