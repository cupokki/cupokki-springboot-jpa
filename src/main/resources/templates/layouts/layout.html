<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupokki JPA Web MVC</title>
    <!-- ✅ Tailwind CDN 추가 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>
<body>
<header class="sticky top-0 bg-white">
    <div class="p-2 flex justify-between w-full">
    <a href="/" class="">
        <img th:src="@{/logo12864t.png}" alt="Logo">
    </a>
    <div class="flex">
        <a th:href="@{/members/join}" class="flex flex-col items-center p-2 inline-block">
            <i class="text-3xl bi bi-person-plus"></i>
            <div class="text-[0.8rem] font-100">
                가입
            </div>
        </a>
        <a th:href="@{/members/login}" class="flex flex-col items-center p-2 inline-block">
            <i class="text-3xl bi bi-box-arrow-in-left"></i>
            <div class="text-[0.8rem] font-100">
                로그인
            </div>
        </a>
        <a th:href="@{/members/login}" class="flex flex-col items-center p-2 inline-block">
            <i class="text-3xl bi bi-box-arrow-right"></i>
            <div class="text-[0.8rem] font-100">
                로그아웃
            </div>
        </a>
        <a th:href="@{/members/{}/profile}" class="flex flex-col items-center p-2 inline-block">
            <i class="text-3xl bi bi-person-plus"></i>
            <div class="text-[0.8rem] font-100">
                프로필
            </div>
        </a>
    </div>
    </div>
    <hr class="bg-black">
</header>

<main layout:fragment="main-content">
    Main
</main>
<footer class="flex justify-center p-10">
    <hr>
    <div class="flex-col gap-4">
        <a href="https://github.com/cupokki" class=""> <i class="bi bi-github"> </i>cupokki</a>
        <p class="">(c) 2025, All right reserved by cupokki</p>
    </div>
</footer>
</body>
</html>
