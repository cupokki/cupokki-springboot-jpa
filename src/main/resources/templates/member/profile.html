<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupokki JPA Web MVC</title>
    <!-- ✅ Tailwind CDN 추가 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>

<main layout:fragment="main-content" class="bg-black">
    <div class="flex justify-center p-20">
        <div class="flex flex-col gap-2 w-[360px] p-12 bg-white rounded-lg">
            <h1 class="font-bold text-center text-[2rem] p-4">회원정보</h1>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="email"  class="px-4 py-2 bg-stone-100 rounded-lg">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="password" class="px-4 py-2 bg-stone-100 rounded-lg">
            <button type="submit" class="text-white m-4 p-4 bg-teal-600 rounded-lg">로그인</button>
            <div class="flex justify-between text-[0.8rem]">
                <a th:href="@{/members/join}">비밀번호찾기</a>
                <a th:href="@{/members/join}">회원가입</a>
            </div>

        </div>

    </div>
    </div>



</main>
</body>
</html>
